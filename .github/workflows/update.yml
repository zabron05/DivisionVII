
name: Update Division VII Leaderboard

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: division-vii-roster-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Blizzard guild rosters
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          python update_roster.py

      - name: Validate leaderboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/leaderboard.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          characters = data.get("characters", [])
          guilds = {
              "rp-horde",
              "rp-alliance",
              "pvp-horde"
          }

          if len(characters) < 60:
              raise SystemExit(
                  "Roster unexpectedly small; refusing to publish."
              )

          found = {c.get("guildId") for c in characters}

          if not guilds.issubset(found):
              raise SystemExit(
                  "Missing one or more guilds; refusing to publish."
              )

          for c in characters:
              if not c.get("name"):
                  raise SystemExit("Character missing name")

              if not isinstance(c.get("level"), int):
                  raise SystemExit("Invalid character level")

          print("Validation passed")
          print("Characters:", len(characters))

          for guild in sorted(guilds):
              count = sum(
                  c["guildId"] == guild
                  for c in characters
              )
              print(guild, count)

          if data.get("errors"):
              print("Warnings:", data["errors"])
          PY

      - name: Commit updated leaderboard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leaderboard.json

          if git diff --cached --quiet; then
            echo "No roster changes to commit."
            exit 0
          fi

          git commit -m "Update Division VII leaderboard"

          # Retry if another commit reached main first.
          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Leaderboard successfully published."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; stopping safely."
              exit 1
            fi

            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done

          echo "Unable to publish after retries."
          exit 1
