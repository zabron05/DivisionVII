
name: Update Armory Roster

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roster-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Armory rosters
        run: python update_roster.py

      - name: Commit updated roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leaderboard.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Division VII roster"

            for attempt in 1 2 3 4 5; do
              git fetch origin main

              if git rebase origin/main && git push origin HEAD:main; then
                echo "Roster successfully published"
                exit 0
              fi

              git rebase --abort 2>/dev/null || true
              sleep 5
            done

            echo "Failed to publish roster after 5 attempts"
            exit 1
          else
            echo "No roster changes to publish"
          fi
