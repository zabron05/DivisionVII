
name: Update Armory Roster

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: division-vii-roster-update
  cancel-in-progress: false

jobs:
  update:
    name: Update Division VII Leaderboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Synchronize with latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch Armory rosters
        run: |
          python update_roster.py

      - name: Commit and publish updated roster
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/leaderboard.json ]; then
            echo "ERROR: data/leaderboard.json was not created."
            exit 1
          fi

          cp data/leaderboard.json /tmp/division-vii-leaderboard.json

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt of 5"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/division-vii-leaderboard.json data/leaderboard.json
            git add data/leaderboard.json

            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi

            git commit -m "Update Division VII roster"

            if git push origin HEAD:main; then
              echo "Roster successfully published."
              exit 0
            fi

            echo "Push rejected. Retrying in 5 seconds..."
            sleep 5
          done

          echo "ERROR: Unable to publish roster after 5 attempts."
          exit 1
